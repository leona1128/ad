<!-- rwd_03 手機滿寬 -->
<div class="adContainer" style="width: 100%; background-color: white; box-sizing: border-box; letter-spacing: 1px; overflow: hidden;">
    <a href="{{clickUrl}}" target="_blank" style="display: flex; font-family: 'PingFang TC', 'Microsoft JhengHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; text-decoration: none; margin: 0; padding-left: 5px; padding-bottom: 5px;">
        <div class="adImg" style="width: 155px; height: 164px;">
            <img src="{{iconUrl}}" style="width: 155px; height: 164px;max-width:none;">
        </div>
        <div class="textContainer" style="display: flex; flex-wrap: wrap; align-content: space-between; color: #222; padding: 5px;">
            <div class="adTitle" style="font-size: 16px; color: #222; line-height: 22px; text-align: left; font-weight: bold; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
                {{title}}
            </div>
            <div class="adDes" style="font-size: 14px; color: #555; line-height: 16px; text-align: left; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;">
                {{description}}
            </div>
            <div class="sponsored" style="font-size: 12px; color: #777; line-height: 16px;">
                {{sponsored}} {{贊助}}
            </div>
        </div>
    </a>
</div>
